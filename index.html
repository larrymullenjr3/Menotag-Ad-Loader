<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="monetag" content="68f716cb1672ff976eb009f4b213f910">

  <title>Monetag Ad Loader</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, #202044 0%, transparent 45%),
        #080811;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 30px 24px;
      background: rgba(22, 22, 42, 0.96);
      border: 1px solid #333354;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
    }

    .icon {
      font-size: 54px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 27px;
    }

    p {
      color: #c4c4dc;
      font-size: 15px;
      line-height: 1.7;
    }

    .example {
      margin: 20px 0;
      padding: 14px;
      overflow-wrap: anywhere;
      background: #0c0c19;
      border: 1px solid #343454;
      border-radius: 12px;
      color: #8bafff;
      font-size: 14px;
    }

    .status {
      display: none;
      margin-top: 20px;
      padding: 14px;
      background: #101020;
      border: 1px solid #343454;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .button {
      width: 100%;
      margin-top: 14px;
      padding: 15px 18px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #7367ff, #4c42d8);
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #retryButton {
      display: none;
    }

    .footer {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid #33334d;
      color: #9999b8;
      font-size: 13px;
      line-height: 1.9;
    }

    .footer a {
      color: #9d91ff;
      text-decoration: none;
      font-weight: bold;
    }

    .footer a:hover {
      color: #c0b9ff;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="icon">📺</div>
    <h1>Monetag Ad Loader</h1>

    <section id="homePage">
      <p>Load a Monetag advertisement using its zone ID.</p>

      <div class="example">Example: /12116377</div>

      <p>
        Add a numeric zone ID to the end of the website URL.
        The homepage itself does not launch advertisements.
      </p>
    </section>

    <section id="adPage" hidden>
      <p id="zoneText"></p>
      <div id="status" class="status" role="status" aria-live="polite"></div>

      <button id="retryButton" class="button" type="button">
        Try Advertisement Again
      </button>
    </section>

    <footer class="footer">
      <div>Monetag Ad Loader</div>
      <div>
        By
        <a href="https://t.me/pakcybertechnumber"
           target="_blank" rel="noopener noreferrer">@PAK CYBER</a>
      </div>
    </footer>
  </main>

  <script>
    (() => {
      "use strict";

      const REDIRECT_URL = "https://uplcm.com/4/12116376";

      const homePage = document.getElementById("homePage");
      const adPage = document.getElementById("adPage");
      const zoneText = document.getElementById("zoneText");
      const statusBox = document.getElementById("status");
      const retryButton = document.getElementById("retryButton");

      const match = location.pathname.match(/^\/(\d+)\/?$/);

      // Homepage: instructions only.
      if (!match) return;

      const zoneId = match[1];
      const sdkName = "show_" + zoneId;

      homePage.hidden = true;
      adPage.hidden = false;
      zoneText.textContent = "Loading advertisement for zone " + zoneId;

      let busy = false;
      let sdkPromise;

      function showStatus(message, color = "#ffffff") {
        statusBox.style.display = "block";
        statusBox.style.color = color;
        statusBox.textContent = message;
      }

      function loadSDK() {
        if (typeof window[sdkName] === "function") {
          return Promise.resolve();
        }

        if (sdkPromise) return sdkPromise;

        sdkPromise = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://libtl.com/sdk.js";
          script.dataset.zone = zoneId;
          script.dataset.sdk = sdkName;
          script.async = true;

          const timeout = setTimeout(() => {
            reject(new Error("Monetag SDK loading timed out."));
          }, 20000);

          script.onload = () => {
            clearTimeout(timeout);

            if (typeof window[sdkName] === "function") {
              resolve();
            } else {
              reject(new Error("Zone function was not found."));
            }
          };

          script.onerror = () => {
            clearTimeout(timeout);
            reject(new Error("Unable to load the Monetag SDK."));
          };

          document.head.appendChild(script);
        }).catch(error => {
          sdkPromise = null;
          throw error;
        });

        return sdkPromise;
      }

      function openRedirect() {
        const telegram = window.Telegram?.WebApp;

        if (telegram && typeof telegram.openLink === "function") {
          try {
            telegram.openLink(REDIRECT_URL);
            return;
          } catch (error) {
            console.error("Telegram openLink failed:", error);
          }
        }

        location.assign(REDIRECT_URL);
      }

      async function startAdvertisement() {
        if (busy) return;

        busy = true;
        retryButton.style.display = "none";
        showStatus("Preparing advertisement...");

        try {
          await loadSDK();

          const showAd = window[sdkName];
          const result = showAd();

          if (!result || typeof result.then !== "function") {
            throw new Error("Unexpected response from the ad SDK.");
          }

          await result;

          // Notify the bot before attempting the redirect.
          const telegram = window.Telegram?.WebApp;

          if (telegram && typeof telegram.sendData === "function") {
            const payload = JSON.stringify({
              event: "monetag_ad_completed",
              zone_id: zoneId,
              timestamp: Date.now()
            });

            // IMPORTANT: sendData may close the Mini App immediately.
            // The bot must handle Telegram's web_app_data event.
            telegram.sendData(payload);

            // Do not call close() here: sendData may already close the app.
            // Redirecting after sendData is not reliable because Telegram
            // may close the Mini App before the next instruction runs.
            return;
          }

          // Non-Telegram fallback: redirect to the destination.
          openRedirect();

        } catch (error) {
          console.error("Monetag error:", error);

          showStatus(
            "The advertisement could not be loaded or completed. Please try again.",
            "#ffcc66"
          );

          retryButton.style.display = "block";

        } finally {
          busy = false;
        }
      }

      retryButton.addEventListener("click", startAdvertisement);
      startAdvertisement();
    })();
  </script>
</body>
  </html>
