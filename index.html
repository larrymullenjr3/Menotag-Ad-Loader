<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="monetag" content="68f716cb1672ff976eb009f4b213f910">
  <title>Monetag Ad Loader</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: #fff;
    }

    main {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 24px;
      text-align: center;
    }

    .logo { font-size: 52px; }

    h1 { font-size: 27px; }

    p {
      color: #aeb8ca;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .panel {
      margin-top: 24px;
      padding: 24px 18px;
      background: #111827;
      border: 1px solid #263247;
      border-radius: 18px;
    }

    .loader {
      width: 38px;
      height: 38px;
      margin: 20px auto;
      border: 4px solid #29364b;
      border-top-color: #42a5ff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden { display: none; }

    .home-button {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 20px;
      border-radius: 10px;
      background: #1685ed;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      padding: 18px 12px;
      text-align: center;
      color: #8290a5;
      font-size: 13px;
    }

    footer a {
      color: #48a6ff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main>
    <div class="logo">⚡</div>
    <h1>Monetag Ad Loader</h1>
    <p id="intro">A simple Monetag rewarded-ad loader.</p>

    <section class="panel">
      <div id="loader" class="loader hidden"></div>
      <h2 id="panelTitle">Welcome</h2>
      <p id="status">
        Open a valid zone link from your Telegram bot to begin.
      </p>
      <a id="homeButton" class="home-button" href="/"
         style="display:none">Return Home</a>
    </section>
  </main>

  <footer>
    Monetag Ad Loader · By
    <a href="https://t.me/pakcybertechnumber"
       target="_blank" rel="noopener noreferrer">@PAK CYBER</a>
  </footer>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script>
    (() => {
      "use strict";

      const REDIRECT_URL = "https://uplcm.com/4/12116376";

      const params = new URLSearchParams(location.search);
      const zoneId = location.pathname.replace(/^\/+|\/+$/g, "");
      const webhookUrl = params.get("webhook");

      const statusEl = document.getElementById("status");
      const titleEl = document.getElementById("panelTitle");
      const introEl = document.getElementById("intro");
      const loaderEl = document.getElementById("loader");
      const homeButton = document.getElementById("homeButton");

      function showError(message) {
        loaderEl.classList.add("hidden");
        titleEl.textContent = "Unable to Start";
        statusEl.textContent = message;
        homeButton.style.display = "inline-block";
      }

      function redirectAndClose() {
        const tg = window.Telegram && window.Telegram.WebApp;

        if (tg && typeof tg.openLink === "function") {
          try {
            tg.openLink(REDIRECT_URL);

            setTimeout(() => {
              try { tg.close(); } catch (_) {}
            }, 700);

            return;
          } catch (_) {}
        }

        location.assign(REDIRECT_URL);
      }

      async function notifyTBC() {
        /*
          No user_id is sent.
          The TBC webhook URL is already bound to the user.
        */
        const payload = {
          event: "monetag_ad_completed",
          zone_id: zoneId,
          timestamp: Date.now()
        };

        /*
          text/plain avoids a JSON CORS preflight.
          TBC reads the body through options.data.
          no-cors means JavaScript cannot inspect the response.
        */
        await fetch(webhookUrl, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=UTF-8"
          },
          body: JSON.stringify(payload)
        });
      }

      async function startAd() {
        if (!/^\d+$/.test(zoneId)) {
          titleEl.textContent = "Monetag Ad Loader";
          introEl.textContent =
            "Open a zone link from your Telegram bot.";
          statusEl.textContent =
            "The homepage does not start an ad automatically.";
          return;
        }

        if (!webhookUrl) {
          showError(
            "Webhook URL is missing. Please reopen the loader from your bot."
          );
          return;
        }

        let parsedWebhook;

        try {
          parsedWebhook = new URL(webhookUrl);
        } catch (_) {
          showError("The webhook URL is invalid.");
          return;
        }

        if (parsedWebhook.protocol !== "https:") {
          showError("The webhook must use HTTPS.");
          return;
        }

        titleEl.textContent = "Preparing Your Ad";
        introEl.textContent = "Please wait while the rewarded ad loads.";
        statusEl.textContent = "Connecting to Monetag…";
        loaderEl.classList.remove("hidden");

        const sdk = document.createElement("script");
        sdk.src = "https://libtl.com/sdk.js";
        sdk.dataset.zone = zoneId;
        sdk.dataset.sdk = "show_" + zoneId;
        sdk.async = true;

        sdk.onload = async () => {
          try {
            const showAd = window["show_" + zoneId];

            if (typeof showAd !== "function") {
              throw new Error("Monetag ad function was not found.");
            }

            titleEl.textContent = "Ad In Progress";
            statusEl.textContent = "Please complete the ad.";

            // Continue when Monetag's promise resolves.
            await showAd();

            titleEl.textContent = "Finishing";
            statusEl.textContent = "Sending completion notification…";

            try {
              await notifyTBC();
            } catch (error) {
              console.error("TBC webhook request failed:", error);
              showError(
                "The ad finished, but the notification could not be sent. " +
                "Please try again later."
              );
              return;
            }

            statusEl.textContent = "Opening the next page…";
            setTimeout(redirectAndClose, 300);

          } catch (error) {
            console.error("Monetag error:", error);
            showError(
              "The ad could not be completed. Return to the bot and try again."
            );
          }
        };

        sdk.onerror = () => {
          showError(
            "Monetag could not load. Check your connection and try again."
          );
        };

        document.head.appendChild(sdk);
      }

      if (zoneId) {
        startAd();
      }
    })();
  </script>
</body>
</html>
