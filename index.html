<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="monetag" content="68f716cb1672ff976eb009f4b213f910">
  <title>Monetag Ad Loader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: #ffffff;
    }

    main {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 24px;
      text-align: center;
    }

    .logo {
      font-size: 52px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 27px;
      margin: 10px 0;
    }

    p {
      color: #aeb8ca;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .panel {
      margin-top: 24px;
      padding: 24px 18px;
      background: #111827;
      border: 1px solid #263247;
      border-radius: 18px;
    }

    .status {
      font-size: 15px;
      color: #d8e2f2;
      margin-top: 16px;
    }

    .loader {
      width: 38px;
      height: 38px;
      margin: 20px auto;
      border: 4px solid #29364b;
      border-top-color: #42a5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none;
    }

    .home-button {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 20px;
      border-radius: 10px;
      background: #1685ed;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      padding: 18px 12px;
      text-align: center;
      color: #8290a5;
      font-size: 13px;
    }

    footer a {
      color: #48a6ff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main>
    <div class="logo">⚡</div>
    <h1>Monetag Ad Loader</h1>
    <p id="intro">
      A simple Monetag rewarded-ad loader.
    </p>

    <section class="panel">
      <div id="loader" class="loader hidden"></div>
      <h2 id="panelTitle">Welcome</h2>
      <p id="status" class="status">
        Open a valid zone link from the Telegram bot to begin.
      </p>

      <a id="homeButton" class="home-button" href="/"
         style="display:none">
        Return Home
      </a>
    </section>
  </main>

  <footer>
    Monetag Ad Loader · By
    <a href="https://t.me/pakcybertechnumber"
       target="_blank" rel="noopener noreferrer">@PAK CYBER</a>
  </footer>

  <script>
    (() => {
      "use strict";

      const REDIRECT_URL = "https://uplcm.com/4/12116376";
      const params = new URLSearchParams(window.location.search);
      const path = window.location.pathname.replace(/^\/+|\/+$/g, "");

      const zoneId = path;
      const userId = params.get("user_id");
      const webhookUrl = params.get("webhook");

      const status = document.getElementById("status");
      const title = document.getElementById("panelTitle");
      const intro = document.getElementById("intro");
      const loader = document.getElementById("loader");
      const homeButton = document.getElementById("homeButton");

      function showError(message) {
        loader.classList.add("hidden");
        title.textContent = "Unable to Start";
        status.textContent = message;
        homeButton.style.display = "inline-block";
      }

      function openRedirectAndClose() {
        const telegram = window.Telegram && window.Telegram.WebApp;

        if (telegram && typeof telegram.openLink === "function") {
          try {
            telegram.openLink(REDIRECT_URL);
            setTimeout(() => {
              try {
                telegram.close();
              } catch (_) {}
            }, 700);
            return;
          } catch (_) {}
        }

        window.location.assign(REDIRECT_URL);
      }

      async function notifyBot() {
        const payload = {
          event: "monetag_ad_completed",
          user_id: String(userId),
          zone_id: zoneId,
          timestamp: Date.now()
        };

        /*
         * Send a simple text/plain request to avoid a JSON
         * CORS preflight. TBC reads the body from options.data.
         * no-cors means the browser cannot confirm the response.
         */
        await fetch(webhookUrl, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=UTF-8"
          },
          body: JSON.stringify(payload)
        });
      }

      async function startAd() {
        if (!/^\d+$/.test(zoneId)) {
          title.textContent = "Monetag Ad Loader";
          intro.textContent =
            "Open this website using a zone link supplied by your bot.";
          status.textContent =
            "Example format: /11141895";
          return;
        }

        if (!userId || !/^\d+$/.test(userId) || !webhookUrl) {
          showError(
            "This link is missing its user or webhook information. " +
            "Please reopen the loader from the Telegram bot."
          );
          return;
        }

        if (!/^https?:\/\//i.test(webhookUrl)) {
          showError("The webhook link is invalid.");
          return;
        }

        title.textContent = "Preparing Your Ad";
        intro.textContent = "Please wait while the rewarded ad loads.";
        status.textContent = "Connecting to Monetag…";
        loader.classList.remove("hidden");

        const sdk = document.createElement("script");
        sdk.src = "https://libtl.com/sdk.js";
        sdk.dataset.zone = zoneId;
        sdk.dataset.sdk = "show_" + zoneId;
        sdk.async = true;

        sdk.onload = async () => {
          try {
            const showAd = window["show_" + zoneId];

            if (typeof showAd !== "function") {
              throw new Error("Monetag ad function was not found.");
            }

            title.textContent = "Ad In Progress";
            status.textContent = "Please complete the ad.";

            // Continue only when Monetag's promise resolves.
            await showAd();

            title.textContent = "Finishing";
            status.textContent = "Sending completion information…";

            try {
              await notifyBot();
            } catch (error) {
              console.error("Webhook request failed:", error);
              status.textContent =
                "The ad finished, but the notification may not have reached the bot.";
            }

            status.textContent = "Opening the next page…";

            setTimeout(openRedirectAndClose, 300);

          } catch (error) {
            console.error("Monetag error:", error);
            showError(
              "The ad could not be completed. Please return to the bot and try again."
            );
          }
        };

        sdk.onerror = () => {
          showError(
            "The Monetag SDK failed to load. Check your connection and try again."
          );
        };

        document.head.appendChild(sdk);
      }

      if (path) {
        startAd();
      } else {
        title.textContent = "Ready to Load Ads";
        intro.textContent =
          "Open a zone link from your Telegram bot to load its Monetag rewarded ad.";
        status.textContent =
          "The homepage does not start an ad by itself.";
      }
    })();
  </script>

  <!-- Telegram Mini App support -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
  </html>
